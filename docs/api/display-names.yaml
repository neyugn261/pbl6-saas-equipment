openapi: 3.1.0
info:
  title: Internal display-name batch lookups
  version: 1.0.0
  description: |
    Optional read composition only, forwarded caller JWT (ADR 0004). Not routed by Gateway.
    Existing individual/list endpoints have no new query parameters or permission changes.
    Only requested IDs in the caller tenant are returned. Inactive/disabled records are included;
    soft-deleted Organization records are omitted. Consumers use bounded batches of 100,
    deduplicate IDs, verify returned tenant and ID, and degrade to null names on 800ms timeout,
    forbidden/missing source, invalid data or unconfigured URL. No persistent cache is used.
security: [{bearerAuth: []}]
paths:
  /internal/display-names/users:
    get:
      tags: [Identity]
      summary: Minimal user names for TENANT_STAFF, matching the existing internal user list scope
      parameters: [{$ref: '#/components/parameters/Ids'}]
      responses:
        '200': {$ref: '#/components/responses/Names'}
        '400': {description: Missing IDs, invalid UUID or more than 100 entries}
        '401': {description: Missing or invalid JWT}
        '403': {description: Non-staff caller or missing tenant}
  /internal/display-names/branches:
    get:
      tags: [Organization]
      summary: Branch names for TENANT_STAFF with branch:read
      parameters: [{$ref: '#/components/parameters/Ids'}]
      responses:
        '200': {$ref: '#/components/responses/Names'}
        '400': {description: Invalid batch}
        '401': {description: Missing or invalid JWT}
        '403': {description: Existing branch lookup authorization denied}
  /internal/display-names/sites:
    get:
      tags: [Organization]
      summary: Site names with customer:read and existing tenant/customer scope
      description: CUSTOMER without linked customer is forbidden. Sites of another customer, deleted sites and sites of deleted customers are omitted.
      parameters: [{$ref: '#/components/parameters/Ids'}]
      responses:
        '200': {$ref: '#/components/responses/Names'}
        '400': {description: Invalid batch}
        '401': {description: Missing or invalid JWT}
        '403': {description: Existing site lookup authorization denied}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Ids:
      name: ids
      in: query
      required: true
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items: {type: string, format: uuid}
  schemas:
    DisplayName:
      type: object
      required: [id, tenantId, name]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        name: {type: string}
        code: {type: string, description: Organization code only}
  responses:
    Names:
      description: Only matching authorized references; missing IDs are omitted and ordering is unspecified
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/DisplayName'}
