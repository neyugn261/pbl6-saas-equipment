openapi: 3.1.0
info:
  title: Inventory Service API — M3 runtime
  version: 0.3.0
  description: |
    Owner Minh. Local Inventory runtime is implemented; Work Order reservation
    contract is awaiting Khương's implementation/review. ISSUE fails closed with
    503 when that capability is unavailable. Notification audience and UI remain
    Huy/Hatsady responsibilities. See ADR 0014 and inventory-reservations.yaml.
    Tenant comes exclusively from the verified token. Stock/catalog/ledger are
    TENANT_STAFF only. A separate equipment-scoped service-parts projection is
    available to CUSTOMER with equipment:read and live Asset ownership validation.
    ADR 0015 defines confirmed use, quarantine, history and internal cost semantics.
    Quantities use decimal strings NUMERIC(12,2), costs NUMERIC(14,2);
    never compute using binary floating point. Mutations are local DB transactions.
    Inventory validates Branch via Organization and Work Order via the scoped
    /internal/work-orders/{id}, forwarding the caller token/correlation ID.
    ISSUE requires a durable WO reservation blocking completion/cancellation until
    Inventory has COMMITTED or ABORTED and WO verifies the proof through an API.
    No timer expiry, status-only fallback, or cross-database transaction is used.
servers: [{ url: / }]
security: [{ bearer: [] }]
x-review-notes: ../plans/minh-m3-inventory-handoff.md
x-reservation-contract: ./inventory-reservations.yaml
paths:
  /inventory-audit:
    $ref: './inventory-accountability.yaml#/paths/~1inventory-audit'
  /stock-transactions/{id}/inspect:
    $ref: './inventory-accountability.yaml#/paths/~1stock-transactions~1{id}~1inspect'
  /work-order-parts/{id}/confirm-use:
    $ref: './inventory-accountability.yaml#/paths/~1work-order-parts~1{id}~1confirm-use'
  /usage-confirmations/{id}/reverse:
    $ref: './inventory-accountability.yaml#/paths/~1usage-confirmations~1{id}~1reverse'
  /equipment/{id}/service-parts:
    $ref: './inventory-accountability.yaml#/paths/~1equipment~1{id}~1service-parts'
  /parts:
    get:
      summary: List parts in tenant, with optional q and status filters
      x-permissions: [inventory:read]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/Status" },
          }
      responses:
        "200":
          {
            description: Parts,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PartPage" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create Part (unique tenant SKU)
      x-permissions: [inventory:manage]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PartInput" } },
          }
      responses:
        "201":
          {
            description: Part,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Part" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /parts/{partId}:
    parameters:
      [
        {
          name: partId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      summary: Part detail (another tenant returns 404)
      x-permissions: [inventory:read]
      responses:
        "200":
          {
            description: Part,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Part" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update Part metadata/status; never delete transactions
      x-permissions: [inventory:manage]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PartPatch" } },
          }
      responses:
        "200":
          {
            description: Part,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Part" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /warehouses:
    get:
      summary: List warehouses in tenant
      x-permissions: [inventory:read]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/Status" },
          }
      responses:
        "200":
          {
            description: Warehouses,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/WarehousePage" } },
              },
          }
    post:
      summary: Create warehouse after validating an active Branch via Organization
      x-permissions: [inventory:manage]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/WarehouseInput" } },
          }
      responses:
        "201":
          {
            description: Warehouse,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Warehouse" } },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidReference" }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/Upstream" }
  /warehouses/{warehouseId}:
    parameters:
      [
        {
          name: warehouseId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      summary: Warehouse detail
      x-permissions: [inventory:read]
      responses:
        "200":
          {
            description: Warehouse,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Warehouse" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update warehouse metadata/status; branch is immutable after creation
      x-permissions: [inventory:manage]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/WarehousePatch" } },
          }
      responses:
        "200":
          {
            description: Warehouse,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Warehouse" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /stocks:
    get:
      summary: Stock list; quantity is changed only through transactions
      x-permissions: [inventory:read]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - {
            name: warehouseId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: partId, in: query, schema: { type: string, format: uuid } }
        - { name: lowStock, in: query, schema: { type: boolean } }
      responses:
        "200":
          {
            description: Stocks,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/StockPage" } },
              },
          }
  /warehouses/{warehouseId}/stocks/{partId}:
    parameters:
      - {
          name: warehouseId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: partId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      summary: Configure minimum quantity (new Stock starts at 0); cannot set quantity
      description: |
        Crossing below the configured minimum also emits an
        alert if no alert is latched. Stock and LowStockDetected outbox update
        atomically. Replenishing to quantity >= minQuantity clears the latch.
      x-permissions: [inventory:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minQuantity]
              properties:
                { minQuantity: { $ref: "#/components/schemas/Quantity" } }
      responses:
        "200":
          {
            description: Stock,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Stock" } },
              },
          }
        "422": { $ref: "#/components/responses/InvalidReference" }
  /stock-transactions:
    get:
      summary: Immutable stock ledger, stable createdAt/id descending order
      x-permissions: [inventory:read]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - {
            name: warehouseId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: partId, in: query, schema: { type: string, format: uuid } }
        - { name: workOrderId, in: query, schema: { type: string, format: uuid } }
        - { name: relatedTransactionId, in: query, schema: { type: string, format: uuid } }
        - {
            name: type,
            in: query,
            schema: { $ref: "#/components/schemas/TransactionType" },
          }
      responses:
        "200":
          {
            description: Ledger,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/TransactionPage" } },
              },
          }
  /stock-transactions/receive:
    post:
      summary: Receive positive quantity into an active part/warehouse
      x-permissions: [inventory:manage]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/StockMutation" } },
          }
      responses:
        "201":
          {
            description: Ledger entry,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Transaction" } },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidReference" }
  /stock-transactions/adjust:
    post:
      summary: Adjust with positive quantity and explicit IN/OUT direction and reason
      description: Stock row is locked; ADJUST_OUT cannot leave quantity negative.
      x-permissions: [inventory:manage]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/StockMutationFields" }
                - type: object
                  required: [direction, note, reasonCode]
                  properties:
                    {
                      direction:
                        { type: string, enum: [ADJUST_IN, ADJUST_OUT] },
                      reasonCode: { type: string, enum: [COUNT_VARIANCE, DAMAGE, LOSS, CORRECTION, OTHER] },
                      relatedTransactionId: { type: string, format: uuid, description: 'Required only for CORRECTION; opposite-direction source receipt/adjustment, bounded by original quantity' },
                    }
              unevaluatedProperties: false
      responses:
        "201":
          {
            description: Ledger entry,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Transaction" } },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-orders/{workOrderId}/parts:
    parameters:
      [
        {
          name: workOrderId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      summary: Parts issued for scoped Work Order, including returns
      x-permissions: [inventory:read]
      responses:
        "200":
          {
            description: Part usages,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/WorkOrderPart" },
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Issue stock under a durable Work Order reservation (F09)
      description: |
        Prepare a durable operation; acquire WO reservation with the forwarded
        caller token. WO must reject COMPLETED/CANCELLED and block terminal
        transitions while HELD. Missing reservation API returns 503 without stock
        writes; retry the SAME key or use inventory-operations recovery routes.
        Lock Stock; decrement quantity, create exactly one ISSUE ledger entry,
        create one WorkOrderPart pointing at that entry, and write any low-stock
        event in one transaction. quantityUsed means issued, not net consumed.
        After commit, settle the hold by verified Inventory proof. A settlement
        outage preserves successful stock writes and returns the original result
        with X-Inventory-Reservation-State=PENDING_FINALIZE. Retry the same key
        with a current authorized token. Keys and response snapshots never expire.
      x-permissions: [inventory:issue]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/StockMutationFields" }
                - type: object
                  properties:
                    {
                      unitCost: { $ref: "#/components/schemas/Money", description: 'Optional internal reference cost; never a customer price. Supply with currency or omit both.' },
                      unitCostCurrency: { type: string, pattern: '^[A-Z]{3}$' }
                    }
              unevaluatedProperties: false
      responses:
        "201":
          {
            description: Issued Part,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/WorkOrderPart" } },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidReference" }
        "502": { $ref: "#/components/responses/Upstream" }
        "503": { $ref: "#/components/responses/Upstream" }
  /work-order-parts/{workOrderPartId}/return:
    parameters:
      [
        {
          name: workOrderPartId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    post:
      summary: Return unused issued parts to their original warehouse (ADR 0006)
      description: |
        Lock usage and stock; RETURN ledger referenceType=WORK_ORDER and
        referenceId=workOrderId. GOOD increases available stock; DAMAGED and
        PENDING_INSPECTION increase quarantine only. Update quantityReturned atomically;
        never change original quantityUsed or its ISSUE transaction. Return total
        plus confirmed-used cannot exceed issued quantity. Returns after WO terminal and after
        Part/Warehouse INACTIVE are allowed for reconciliation. A new return
        validates scoped WO; successful retries remain available during an outage.
        New RETURN entries include workOrderPartId, balanceBefore and balanceAfter.
      x-permissions: [inventory:issue]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity, note, condition]
              properties:
                quantity: { $ref: "#/components/schemas/PositiveQuantity" }
                note: { type: string, minLength: 1, maxLength: 2000 }
                condition: { type: string, enum: [GOOD, DAMAGED, PENDING_INSPECTION] }
      responses:
        "200":
          {
            description: Updated usage,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/WorkOrderPart" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page:
      {
        name: page,
        in: query,
        schema: { type: integer, minimum: 1, default: 1 },
      }
    PageSize:
      {
        name: pageSize,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
      }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client UUID retained durably with tenant, endpoint, canonical payload hash
        and response. Same key/body returns the original result; another body or
        endpoint with the same tenant/key returns 409. Decimal strings and UUIDs
        are normalized before hashing. Migration 0003 stores the request, actor,
        response and phase. ISSUE may be PENDING after a timeout; retry the SAME
        key, not a fresh key. No automatic expiry during MVP. Replay still checks
        current authentication, permissions and tenant scope.
      schema: { type: string, format: uuid }
  schemas:
    Status: { type: string, enum: [ACTIVE, INACTIVE] }
    Quantity:
      {
        type: string,
        pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,2})?$',
        examples: ["0.00", "12.50"],
      }
    PositiveQuantity:
      allOf: [{ $ref: "#/components/schemas/Quantity" }]
      not: { enum: ["0", "0.0", "0.00"] }
    Money:
      {
        type: string,
        pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$',
        examples: ["125000.00"],
      }
    TransactionType:
      { type: string, enum: [RECEIVE, ISSUE, RETURN, ADJUST_IN, ADJUST_OUT, RELEASE, SCRAP] }
    PartInput:
      allOf: [{ $ref: "#/components/schemas/PartFields" }]
      unevaluatedProperties: false
    PartFields:
      type: object
      required: [sku, name, unit]
      properties:
        sku: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, minLength: 1, maxLength: 30 }
        allowFractional: { type: boolean, default: false, description: 'Immutable quantity policy. Legacy parts retain true; no historical rounding.' }
        description: { type: [string, "null"], maxLength: 4000 }
    PartPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
        status: { $ref: "#/components/schemas/Status" }
    Part:
      allOf:
        - { $ref: "#/components/schemas/PartFields" }
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/Status" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    WarehouseInput:
      allOf: [{ $ref: "#/components/schemas/WarehouseFields" }]
      unevaluatedProperties: false
    WarehouseFields:
      type: object
      required: [branchId, code, name]
      properties:
        branchId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 150 }
        address: { type: [string, "null"], maxLength: 4000 }
    WarehousePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        address: { type: [string, "null"], maxLength: 4000 }
        status: { $ref: "#/components/schemas/Status" }
    Warehouse:
      allOf:
        - { $ref: "#/components/schemas/WarehouseFields" }
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            branchName: { type: [string, 'null'], description: Optional current branch name on list reads }
            branchCode: { type: [string, 'null'] }
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/Status" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Stock:
      type: object
      required:
        [
          id,
          warehouseId,
          partId,
          quantity,
          minQuantity,
          lowStockAlertedAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        partId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/Quantity" }
        quantityQuarantined: { $ref: "#/components/schemas/Quantity", description: 'Not available for ISSUE' }
        quantityPhysicalAtWarehouse:
          type: string
          readOnly: true
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
          description: >-
            Available plus quarantine; stock list only. This derived sum can exceed
            the 10 integer digits allowed in either individual stock bucket.
        isLowStock: { type: boolean }
        shortageQuantity: { $ref: "#/components/schemas/Quantity" }
        part: { $ref: "#/components/schemas/Part" }
        warehouse: { $ref: "#/components/schemas/Warehouse" }
        minQuantity: { $ref: "#/components/schemas/Quantity" }
        lowStockAlertedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    StockMutationFields:
      type: object
      required: [warehouseId, partId, quantity]
      properties:
        warehouseId: { type: string, format: uuid }
        partId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/PositiveQuantity" }
        note: { type: string, minLength: 1, maxLength: 2000 }
        documentReference: { type: string, minLength: 1, maxLength: 150 }
    StockMutation:
      allOf: [{ $ref: "#/components/schemas/StockMutationFields" }]
      anyOf: [{ required: [note] }, { required: [documentReference] }]
      unevaluatedProperties: false
    Transaction:
      type: object
      required:
        [
          id,
          warehouseId,
          partId,
          type,
          quantity,
          referenceType,
          referenceId,
          note,
          createdBy,
          createdAt,
        ]
      properties:
        part:
          type: object
          description: Current metadata on ledger reads, including inactive parts. Prefer partSnapshot for historical labels.
          properties:
            name: { type: string }
            sku: { type: string }
        warehouse:
          type: object
          description: Current metadata on ledger reads, including inactive warehouses. Prefer warehouseSnapshot for historical labels.
          properties:
            name: { type: string }
            code: { type: string }
        reasonCode: { type: [string, 'null'] }
        documentReference: { type: [string, 'null'] }
        relatedTransactionId: { type: [string, 'null'], format: uuid }
        returnCondition: { type: [string, 'null'], enum: [GOOD, DAMAGED, PENDING_INSPECTION, null] }
        quarantineBefore: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        quarantineAfter: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        partSnapshot: { type: [object, 'null'], description: 'Historical SKU/name/unit/quantity policy; null for legacy rows' }
        warehouseSnapshot: { type: [object, 'null'] }
        balanceBefore: { anyOf: [{ $ref: "#/components/schemas/Quantity" }, { type: "null" }], description: "Null only for legacy rows; never guessed" }
        balanceAfter: { anyOf: [{ $ref: "#/components/schemas/Quantity" }, { type: "null" }] }
        workOrderPartId: { type: [string, "null"], format: uuid, description: "Exact originating usage for a RETURN; null otherwise" }
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        partId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/TransactionType" }
        quantity: { $ref: "#/components/schemas/PositiveQuantity" }
        referenceType: { type: [string, "null"], enum: [WORK_ORDER, null] }
        referenceId: { type: [string, "null"], format: uuid }
        note: { type: [string, "null"] }
        createdBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    WorkOrderPart:
      type: object
      required:
        [
          id,
          workOrderId,
          partId,
          warehouseId,
          stockTransactionId,
          quantityUsed,
          quantityReturned,
          unitCost,
          recordedBy,
          createdAt,
        ]
      properties:
        quantityConsumed: { $ref: "#/components/schemas/Quantity", description: "Confirmed-used only; no longer inferred from unreturned issued quantity (ADR 0015)" }
        quantityIssued: { $ref: '#/components/schemas/Quantity' }
        quantityOutstanding: { $ref: '#/components/schemas/Quantity', description: 'Issued minus returned; includes confirmed use' }
        quantityConfirmedUsed: { $ref: '#/components/schemas/Quantity' }
        quantityUnreconciled: { $ref: '#/components/schemas/Quantity', description: 'Issued minus returned minus confirmed used' }
        confirmations: { type: array, items: { $ref: './inventory-accountability.yaml#/components/schemas/Confirmation' } }
        partSnapshot: { type: [object, 'null'] }
        warehouseSnapshot: { type: [object, 'null'] }
        costMeaning: { const: INTERNAL_REFERENCE_COST_NOT_CUSTOMER_PRICE }
        unitCostCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        returns: { type: array, items: { $ref: "#/components/schemas/Transaction" }, description: "Present in GET usage list; linked return ledger rows" }
        id: { type: string, format: uuid }
        workOrderId: { type: string, format: uuid }
        partId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        stockTransactionId: { type: string, format: uuid }
        quantityUsed: { $ref: "#/components/schemas/PositiveQuantity" }
        quantityReturned: { $ref: "#/components/schemas/Quantity" }
        unitCost:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        recordedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    PageFields:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    PartPage:
      allOf:
        [
          { $ref: "#/components/schemas/PageFields" },
          {
            type: object,
            properties:
              {
                items:
                  { type: array, items: { $ref: "#/components/schemas/Part" } },
              },
          },
        ]
    WarehousePage:
      allOf:
        [
          { $ref: "#/components/schemas/PageFields" },
          {
            type: object,
            properties:
              {
                items:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/Warehouse" },
                  },
              },
          },
        ]
    StockPage:
      allOf:
        [
          { $ref: "#/components/schemas/PageFields" },
          {
            type: object,
            properties:
              {
                items:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/Stock" },
                  },
              },
          },
        ]
    TransactionPage:
      allOf:
        [
          { $ref: "#/components/schemas/PageFields" },
          {
            type: object,
            properties:
              {
                items:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/Transaction" },
                  },
              },
          },
        ]
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
  responses:
    BadRequest:
      {
        description: Invalid body/decimal/key,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Forbidden:
      {
        description: Permission or user type denied,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    NotFound:
      {
        description: Missing or outside token tenant,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Conflict:
      {
        description: Duplicate code/key or insufficient stock/terminal WO/excess return,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    InvalidReference:
      {
        description: Invalid or inactive Part/Warehouse/Branch/WO reference,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Upstream:
      {
        description: Organization or Work Order unavailable/failed; no local stock write,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
