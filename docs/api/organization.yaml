        code: { type: [string, 'null'], maxLength: 50 }
        name: { type: string, maxLength: 150 }
        type: { $ref: '#/components/schemas/LocationType' }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ActiveStatus' }
    Contact:
      type: object
