name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  identity-db:
    name: Identity migrations and e2e (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pbl6
          POSTGRES_PASSWORD: pbl6_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbl6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pbl6_ci_password
      IDENTITY_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/identity_db
      IDENTITY_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/identity_shadow_db
      IDENTITY_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/identity_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases (bootstrap script, run twice to prove it is idempotent)
        run: |
          psql -h localhost -U pbl6 -d postgres -f infrastructure/postgres/init.sql
          psql -h localhost -U pbl6 -d postgres -f infrastructure/postgres/init.sql
          psql -h localhost -U pbl6 -d postgres -c 'CREATE DATABASE identity_shadow_db' -c 'CREATE DATABASE identity_test_db'
      - name: Apply migrations
        working-directory: apps/identity-service
        run: pnpm db:migrate && pnpm db:migrate
      - name: Check schema drift (migrations vs schema.prisma vs database)
        working-directory: apps/identity-service
        run: |
          pnpm db:check-drift
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed (twice, must be idempotent)
        working-directory: apps/identity-service
        run: pnpm db:seed && pnpm db:seed
      - name: e2e tests
        working-directory: apps/identity-service
        run: pnpm test:e2e
