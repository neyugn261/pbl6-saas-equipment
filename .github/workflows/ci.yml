name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      # Real broker for the transport test of @pbl6/event-contracts.
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: pbl6
          RABBITMQ_DEFAULT_PASS: pbl6_ci_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RABBITMQ_TEST_URL: amqp://pbl6:pbl6_ci_password@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bootstrap e2e (no database)
        run: pnpm --filter organization-service --filter asset-service --filter service-request-service --filter maintenance-service --filter workorder-service test:e2e
      - name: API Gateway e2e tests
        working-directory: apps/api-gateway
        run: pnpm test:e2e
      - run: pnpm build

  databases:
    name: M1 database tests and Gateway smoke (Compose PostgreSQL 17)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: pbl6_ci_password
      PGPASSWORD: pbl6_ci_password
      IDENTITY_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/identity_db
      IDENTITY_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/identity_shadow_db
      ORGANIZATION_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/organization_db
      ORGANIZATION_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/organization_shadow_db
      ASSET_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/asset_db
      ASSET_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/asset_shadow_db
      SERVICE_REQUEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/service_request_db
      SERVICE_REQUEST_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/service_request_shadow_db
      WORKORDER_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/workorder_db
      WORKORDER_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/workorder_shadow_db
      WORKORDER_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/workorder_test_db
      MAINTENANCE_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/maintenance_db
      MAINTENANCE_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/maintenance_shadow_db
      INVENTORY_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/inventory_db
      INVENTORY_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/inventory_shadow_db
      NOTIFICATION_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/notification_db
      NOTIFICATION_SHADOW_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/notification_shadow_db
      IDENTITY_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/identity_test_db
      ORGANIZATION_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/organization_test_db
      ASSET_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/asset_test_db
      SERVICE_REQUEST_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/service_request_test_db
      MAINTENANCE_TEST_DATABASE_URL: postgresql://pbl6:pbl6_ci_password@localhost:5432/maintenance_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Start PostgreSQL and RabbitMQ with Compose
        run: |
          docker compose up -d postgres rabbitmq
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U pbl6 -d postgres; then exit 0; fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Create databases (bootstrap scripts, run twice to prove they are idempotent)
        run: |
          for f in infrastructure/postgres/init.sql infrastructure/postgres/dev-databases.sql; do
            psql -h localhost -U pbl6 -d postgres -f "$f"
            psql -h localhost -U pbl6 -d postgres -f "$f"
          done
      - name: Apply migrations of every service (twice)
        run: pnpm db:migrate && pnpm db:migrate
      - name: Check schema drift (migrations vs schema.prisma)
        run: pnpm db:check-drift
      - name: Check schema drift (database vs schema.prisma)
        run: |
          for svc in identity-service organization-service asset-service service-request-service workorder-service maintenance-service inventory-service notification-service; do
            echo "::group::$svc"
            (cd "apps/$svc" && pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code)
            echo "::endgroup::"
          done
      - name: Seed Identity (twice, must be idempotent)
        working-directory: apps/identity-service
        run: pnpm db:seed && pnpm db:seed
      - name: Identity e2e tests
        working-directory: apps/identity-service
        run: pnpm test:e2e
      - name: Seed Organization dev data (twice, must be idempotent)
        working-directory: apps/organization-service
        run: pnpm db:seed:dev && pnpm db:seed:dev
      - name: Organization e2e tests (organization_test_db)
        working-directory: apps/organization-service
        run: pnpm test:e2e:db
      - name: Asset e2e tests
        working-directory: apps/asset-service
        run: pnpm test:e2e
      - name: Asset integration tests (asset_test_db)
        working-directory: apps/asset-service
        run: pnpm test:db
      - name: Service Request e2e tests
        working-directory: apps/service-request-service
        run: pnpm test:e2e
      - name: Service Request database e2e tests
        working-directory: apps/service-request-service
        run: pnpm test:e2e:db
      - name: Work Order database e2e tests
        working-directory: apps/workorder-service
        run: pnpm test:e2e:db
      - name: Maintenance test DB migration and owner-provided suite
        run: |
          set -euo pipefail
          actual="$(node -e 'process.stdout.write(new URL(process.argv[1]).pathname.slice(1))' "$MAINTENANCE_TEST_DATABASE_URL")"
          if [ "$actual" != maintenance_test_db ]; then
            echo "Refusing Maintenance test DB setup: got $actual" >&2
            exit 1
          fi
          export MAINTENANCE_DATABASE_URL="$MAINTENANCE_TEST_DATABASE_URL"
          pnpm --filter maintenance-service db:migrate
          for script in test:e2e:db test:db; do
            if node -e 'process.exit(require(process.argv[1]).scripts[process.argv[2]] ? 0 : 1)' ./apps/maintenance-service/package.json "$script"; then
              pnpm --filter maintenance-service "$script"
            else
              echo "maintenance-service: $script not declared yet"
            fi
          done
      - name: M1 regression and M2 workflows through API Gateway
        env:
          NODE_ENV: development
          # Three smoke suites share one source IP and perform more than ten logins.
          LOGIN_RATE_LIMIT: 50
          JWT_ACCESS_SECRET: ci-smoke-access-secret-0123456789abcdef
          SEED_DEMO_PASSWORD: ci-smoke-demo-password
          IDENTITY_EXPOSE_ACTIVATION_TOKEN: 'true'
          IDENTITY_SERVICE_URL: http://127.0.0.1:3001
          ASSET_SERVICE_URL: http://127.0.0.1:3002
          MAINTENANCE_SERVICE_URL: http://127.0.0.1:3003
          WORKORDER_SERVICE_URL: http://127.0.0.1:3004
          NOTIFICATION_SERVICE_URL: http://127.0.0.1:3005
          ORGANIZATION_SERVICE_URL: http://127.0.0.1:3006
          SERVICE_REQUEST_SERVICE_URL: http://127.0.0.1:3007
          INVENTORY_SERVICE_URL: http://127.0.0.1:3008
          ASSET_QR_PORTAL_BASE_URL: http://127.0.0.1:5173
          GATEWAY_URL: http://127.0.0.1:3000
          RABBITMQ_URL: amqp://pbl6:pbl6_dev_password@127.0.0.1:5672
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping; then break; fi
            if [ "$attempt" = 30 ]; then docker compose logs rabbitmq; exit 1; fi
            sleep 2
          done
          pnpm --filter identity-service --filter organization-service --filter asset-service --filter service-request-service --filter workorder-service --filter api-gateway build
          pnpm --filter identity-service db:seed:dev
          pnpm --filter asset-service db:seed:dev
          pnpm --filter identity-service start:prod > /tmp/m1-identity.log 2>&1 & identity_pid=$!
          trap 'kill $identity_pid ${organization_pid:-} ${asset_pid:-} ${request_pid:-} ${workorder_pid:-} ${gateway_pid:-} 2>/dev/null || true' EXIT
          wait_health() {
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$1/health" > /dev/null; then return 0; fi
              sleep 2
            done
            cat /tmp/m1-*.log
            return 1
          }
          wait_health "$IDENTITY_SERVICE_URL"
          pnpm --filter organization-service db:seed:dev
          pnpm --filter organization-service start:prod > /tmp/m1-organization.log 2>&1 & organization_pid=$!
          pnpm --filter asset-service start:prod > /tmp/m1-asset.log 2>&1 & asset_pid=$!
          pnpm --filter service-request-service start:prod > /tmp/m1-request.log 2>&1 & request_pid=$!
          pnpm --filter workorder-service start:prod > /tmp/m1-workorder.log 2>&1 & workorder_pid=$!
          wait_health "$ORGANIZATION_SERVICE_URL"
          wait_health "$ASSET_SERVICE_URL"
          wait_health "$SERVICE_REQUEST_SERVICE_URL"
          wait_health "$WORKORDER_SERVICE_URL"
          pnpm --filter api-gateway start:prod > /tmp/m1-gateway.log 2>&1 & gateway_pid=$!
          wait_health "$GATEWAY_URL"
          pnpm smoke:m1
          pnpm smoke:m2:week1
          pnpm smoke:m2:week2
      - name: Stop Compose infrastructure
        if: always()
        run: docker compose down --volumes
